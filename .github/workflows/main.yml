name: CI devops 2025
on:  # run the pipeline on every push to main and develop
  push:
    branches:
      - main
      - develop
  # and on every pull request, so changes are tested before being merged
  pull_request:

# Continuous Integration only: build, test and analyse the backend.
# The delivery of docker images is in cd.yml, triggered when this workflow succeeds on main.
jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # checkout the repository code onto the runner
      - uses: actions/checkout@v4

      #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      #finally build your app with the latest command
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml

      # run the SonarCloud analysis (bugs, vulnerabilities, code smells, coverage)
      - name: Build and test with SonarQube
        # the scanner reads the token from the SONAR_TOKEN env variable
        # (-Dsonar.login is deprecated, and this keeps the token out of the command line)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=${{ secrets.PROJECT_KEY }} -Dsonar.organization=${{ secrets.ORGANIZATION_KEY }} -Dsonar.host.url=https://sonarcloud.io --file ./simple-api/pom.xml

  # check that the front still builds (the image itself is pushed by cd.yml)
  build-front:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build front image
        run: docker build ./front

  # check that the Ansible image builds and that the playbook is valid
  check-ansible:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build Ansible image
        run: docker build -t ansible-runner ./ansible

      - name: Check playbook syntax
        run: docker run --rm -v "$PWD/ansible:/ansible" ansible-runner ansible-playbook -i inventories/setup.yml playbook.yml --syntax-check
