name: CI devops 2025
on:  # run the pipeline on every push to main and develop
  push:
    branches:
      - main
      - develop
  # and on every pull request, so changes are tested before being merged
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # checkout the repository code onto the runner
      - uses: actions/checkout@v4

      #do the same with another action (actions/setup-java@v4) that enable to setup jdk 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      #finally build your app with the latest command
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml

      # run the SonarCloud analysis (bugs, vulnerabilities, code smells, coverage)
      - name: Build and test with SonarQube
        # the scanner reads the token from the SONAR_TOKEN env variable
        # (-Dsonar.login is deprecated, and this keeps the token out of the command line)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify sonar:sonar -Dsonar.projectKey=${{ secrets.PROJECT_KEY }} -Dsonar.organization=${{ secrets.ORGANIZATION_KEY }} -Dsonar.host.url=https://sonarcloud.io --file ./simple-api/pom.xml

  # OWASP Dependency-Check: scan the dependencies of the pom for known vulnerabilities (CVE)
  # runs in parallel with test-backend, fails if a vulnerability has a CVSS score >= 7
  owasp-dependency-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      # keep the NVD vulnerability database between runs (the first download is long)
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: nvd-data-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B dependency-check:check --file ./simple-api/pom.xml

      # publish the HTML report as a downloadable artifact, even when the scan fails
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: simple-api/target/dependency-check-report.html

  # define job to build and publish docker image
  build-and-push-docker-image:
    needs: test-backend
    # run only when code is compiling and tests are passing
    runs-on: ubuntu-24.04
    # gives access to the secrets stored in the "docker_hub" environment
    environment: docker_hub

    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login --username ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./simple-api
          # Note: tags has to be all lower-case
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/tp-devops-simple-api:latest
          # build on feature branches, push only on main branch
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}