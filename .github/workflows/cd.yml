name: CD devops 2025
on:
  # triggered when the CI workflow (main.yml) finishes
  workflow_run:
    workflows: ["CI devops 2025"]
    types: [completed]
    # only for CI runs on the main branch
    branches: [main]

jobs:
  # define job to build and publish docker image
  build-and-push-docker-image:
    # run only if test-backend passed (CI succeeded) and the CI was started by a push on main,
    # not by a pull request whose source branch is called main
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04
    # gives access to the secrets stored in the "docker_hub" environment
    environment: docker_hub
    # version tag shared with the deploy job, so it deploys exactly the images built here
    outputs:
      image_tag: ${{ steps.version.outputs.tag }}

    # steps to perform in job
    steps:
      # check out exactly the commit that was tested by the CI
      # (by default workflow_run checks out the latest commit of the default branch)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login --username ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      # version tag of the images = short hash of the tested commit (e.g. sha-1c87cf0)
      # each delivery keeps its own tag, so a previous version can always be pulled again (rollback)
      - name: Compute image version
        id: version
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "tag=sha-${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"

      # this workflow only runs for main, so images are always pushed
      # each image gets 2 tags: the immutable version tag and "latest" (moved to the newest version)
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          # relative path to the place where source code with Dockerfile is located
          context: ./simple-api
          # Note: tags has to be all lower-case
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp-devops-simple-api:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp-devops-simple-api:latest
          push: true

      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp-devops-database:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp-devops-database:latest
          push: true

      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp-devops-httpd:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKER_HUB_USERNAME }}/tp-devops-httpd:latest
          push: true

  # deploy the new images on the server with the Ansible playbook
  deploy:
    # run only once the images are pushed on Docker Hub
    needs: build-and-push-docker-image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Ansible
        run: pip install ansible

      # write the private key from the secrets where the inventory expects it (~/.ssh/id_rsa)
      # and trust the server's host key, as the runner has never connected to it
      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 400 ~/.ssh/id_rsa
          ssh-keyscan -H minh.nguyen.takima.school >> ~/.ssh/known_hosts

      # deploy the version tag built above rather than "latest"
      - name: Run Ansible playbook
        working-directory: ./ansible
        run: ansible-playbook -i inventories/setup.yml playbook.yml -e image_tag=${{ needs.build-and-push-docker-image.outputs.image_tag }}
