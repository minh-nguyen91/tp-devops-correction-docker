name: OWASP Dependency-Check
# same triggers as the CI, but in its own workflow so that a vulnerability report
# does not block the docker delivery (cd.yml only waits for "CI devops 2025")
on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  # scan the dependencies of the pom for known vulnerabilities (CVE)
  # fails if a vulnerability has a CVSS score >= 7 (configured in the pom)
  owasp-dependency-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
          cache: maven

      # keep the NVD vulnerability database between runs (the first download is long)
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-data-${{ github.run_id }}
          restore-keys: nvd-data-

      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B dependency-check:check --file ./simple-api/pom.xml

      # publish the HTML report as a downloadable artifact, even when the scan fails
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: simple-api/target/dependency-check-report.html
