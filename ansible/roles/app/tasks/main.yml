---
# Launch the Spring Boot API
- name: Run the API
  docker_container:
    # the proxy forwards requests to http://simple-api:8080, so the name must stay "simple-api"
    name: simple-api
    image: "{{ docker_hub_user }}/tp-devops-simple-api:{{ image_tag }}"
    pull: always
    restart_policy: unless-stopped
    # variables read by application.yml to reach the database
    env:
      DATABASE_HOST: "{{ database_container }}"
      DATABASE_PASSWORD: "{{ database_password }}"
    networks:
      - name: "{{ docker_network }}"
  vars:
    ansible_python_interpreter: "{{ docker_python_interpreter }}"
